<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>霍格沃茨分院测试</title>
    <!-- html2canvas 库用于生成分享图片 -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a2a1f;
            background-image: radial-gradient(circle at 15% 30%, #2a3a1f 2%, transparent 2.5%);
            background-size: 32px 32px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', 'Times New Roman', 'Segoe UI', serif;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #fef7e0;
            background-image: linear-gradient(to bottom, #fff6e6, #f9efda);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 200, 0.8);
            overflow: hidden;
            border: 1px solid #dac292;
        }

        .header {
            background: #2c2b26;
            padding: 22px 20px 18px;
            text-align: center;
            border-bottom: 4px solid #c9a03d;
            box-shadow: 0 3px 0 #1e1c18;
        }

        .header h1 {
            font-family: 'Cinema', 'Georgia', serif;
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: #f3d572;
            text-shadow: 2px 2px 0 #4a2a1e;
            font-weight: bold;
            white-space: nowrap;
        }

        .header p {
            color: #cfc39e;
            margin-top: 8px;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        .quiz-card {
            padding: 28px 20px 32px;
        }

        .start-screen, .result-screen {
            text-align: center;
        }

        .start-screen h2 {
            font-size: 1.5rem;
            color: #2a3b1c;
            margin-bottom: 16px;
            font-weight: bold;
            border-left: 4px solid #b8860b;
            padding-left: 12px;
            text-align: left;
        }

        .start-screen p {
            color: #3e2e22;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 28px;
            background: #fff3e0;
            padding: 20px;
            border-radius: 28px;
            border: 1px solid #e6cf9e;
            text-align: left;
        }

        .btn {
            background: #3a5c3a;
            border: none;
            color: #f9efcf;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 5px 0 #1f3a1f;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: #4f784f;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #1f3a1f;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1f3a1f;
        }

        .question-area {
            display: none;
        }

        .progress-area {
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 6px;
            background: #e2d5b6;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #b47c2e;
            transition: width 0.2s;
        }

        .q-counter {
            display: inline-block;
            background: #3c3428;
            padding: 4px 16px;
            border-radius: 30px;
            color: #f0dfa8;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        .q-text {
            font-size: 1.45rem;
            font-weight: 700;
            line-height: 1.35;
            margin: 20px 0 24px;
            color: #2e241b;
            background: #fff8ed;
            padding: 20px 18px;
            border-radius: 32px;
            border: 1px solid #e2cfaa;
            box-shadow: inset 0 1px 3px #0001, 0 2px 2px #fff8;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .option {
            background: #fffcf5;
            border: 1px solid #e2cfaa;
            border-radius: 60px;
            padding: 12px 18px;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.95rem;
        }

        .option:hover {
            background: #ffefd0;
            border-color: #bc8f4b;
        }

        input[type="radio"] {
            accent-color: #9b2c1d;
            width: 20px;
            height: 20px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .option label {
            flex: 1;
            cursor: pointer;
            font-weight: 500;
            color: #3a2a1c;
            line-height: 1.4;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-top: 8px;
        }

        .nav-btn {
            background: #7a6233;
            box-shadow: 0 3px 0 #4d3b1f;
            font-size: 1rem;
            padding: 10px 20px;
            flex: 1;
            text-align: center;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .result-screen {
            display: none;
            background: #fdf8ed;
            border-radius: 28px;
            padding: 8px 0;
        }

        .result-scroll {
            max-height: 70vh;
            overflow-y: auto;
            padding: 8px 12px 20px;
        }

        /* 截图专用区域 (保证样式完整) */
        .share-screenshot {
            background: #fdf8ed;
            border-radius: 28px;
            padding: 16px 12px 20px;
            text-align: center;
        }

        .official-seal {
            text-align: center;
            margin-bottom: 16px;
        }

        .official-seal span {
            font-size: 2rem;
            letter-spacing: 8px;
            color: #b28b3e;
            white-space: nowrap;
        }

        .result-sub {
            font-size: 1.1rem;
            text-align: center;
            color: #6b4c2c;
            margin-top: 12px;
            margin-bottom: 8px;
            font-style: italic;
        }

        .result-title {
            font-size: 2rem;
            font-weight: 800;
            color: #1f3a1a;
            text-align: center;
            margin: 8px 0 12px;
            font-family: 'Cinema', 'Georgia', serif;
            border-top: 2px solid #c6a35e;
            border-bottom: 2px solid #c6a35e;
            display: inline-block;
            width: auto;
            padding: 10px 20px;
            background: #fff2e0;
            border-radius: 40px;
        }

        .result-desc {
            font-size: 1rem;
            line-height: 1.55;
            color: #2e2b24;
            background: #fffcf0;
            padding: 24px 22px;
            border-radius: 32px;
            margin: 20px 0 24px;
            border: 1px solid #e2cfaa;
            box-shadow: inset 0 0 0 1px #fffef7, 0 6px 12px rgba(0,0,0,0.05);
            text-align: left;
        }

        .restart-btn, .share-btn {
            background: #8b6946;
            box-shadow: 0 4px 0 #5a3e24;
            width: 80%;
            margin-top: 12px;
            font-size: 1.05rem;
        }

        .share-btn {
            background: #2c5a6e;
            box-shadow: 0 4px 0 #1e3f4e;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        footer {
            background: #2c2b26;
            padding: 12px;
            text-align: center;
            font-size: 0.65rem;
            color: #b8a97a;
            border-top: 1px solid #4a3e2c;
        }

        /* 手机竖屏适配 */
        @media (max-width: 550px) {
            .container {
                max-width: 100%;
                margin: 0;
            }
            .header h1 {
                font-size: 1.3rem;
                white-space: normal;
                word-break: keep-all;
            }
            .official-seal span {
                font-size: 1.2rem;
                letter-spacing: 2px;
                white-space: normal;
            }
            .q-text {
                font-size: 1.2rem;
                padding: 16px;
            }
            .option label {
                font-size: 0.85rem;
            }
            .result-title {
                font-size: 1.5rem;
                padding: 6px 16px;
            }
            .result-sub {
                font-size: 1rem;
            }
            .btn {
                padding: 12px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="header">
        <h1>霍格沃茨分院测试</h1>
        <p>霍格沃茨魔法学校 · 正式分院评估</p>
    </div>
    <div class="quiz-card" id="quizCard">
        <div id="startScreen" class="start-screen">
            <h2>⚜️ 分院仪式 ⚜️</h2>
            <p>请保持安静，集中意念。分院帽将根据你的内在特质、勇气、智慧、忠诚与野心，以及一些……<strong>难以预料的变量</strong>，为你分配合适的学府归属。<br><br>注：本次分院使用最新版《霍格沃茨特约评估手册》，可能出现罕见分支结果。请如实回答以下二十个问题。</p>
            <button class="btn" id="startBtn">戴上分院帽</button>
        </div>

        <div id="questionArea" class="question-area">
            <div class="progress-area">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <div style="display: flex; justify-content: flex-end;"><span class="q-counter" id="qCounter">第1 / 20题</span></div>
            </div>
            <div class="q-text" id="questionText">加载中...</div>
            <div class="options-list" id="optionsContainer"></div>
            <div class="nav-buttons">
                <button class="btn nav-btn" id="prevBtn">◀ 上一题</button>
                <button class="btn nav-btn" id="nextBtn">下一题 ▶</button>
            </div>
        </div>

        <div id="resultScreen" class="result-screen">
            <div class="result-scroll" id="resultScroll">
                <!-- 截图时基于这块区域 -->
                <div id="shareScreenshotArea" class="share-screenshot">
                    <div class="official-seal"><span>✧ 霍格沃茨魔法学校 ✧</span></div>
                    <div class="result-sub">你的分院结果是 ——</div>
                    <div style="text-align: center;">
                        <div class="result-title" id="resultTitle"></div>
                    </div>
                    <div class="result-desc" id="resultDesc"></div>
                    <div style="margin-top: 16px; font-size: 0.7rem; text-align: center; color: #8b7755;">校长：米勒娃·麦格<br>（本通知书由猫头鹰特快派送）</div>
                </div>
                <div class="button-group">
                    <button class="btn share-btn" id="shareBtn">📤 分享结果</button>
                    <button class="btn restart-btn" id="restartBtn">🪶 重新接受分院</button>
                </div>
            </div>
        </div>
    </div>
    <footer>© 霍格沃茨分院委员会 · 结果以分院帽裁定为准</footer>
</div>

<script>
    // 70个全魔法梗问题 (每个选项等长+带梗)
    const MASTER_QUESTIONS = [
        { text: "早上闹钟响了，你按掉之后做了什么？", opts: ["念了句“无声无息”然后继续睡", "用飞来咒找袜子但没找到", "对枕头施了昏昏倒地", "以为是吼叫信吓得跳下床"] },
        { text: "你在超市排队，前面的人很慢。你会？", opts: ["偷偷用“腿立僵停死”让他定住", "掏出魔杖造型的笔假装要念咒", "怀疑他中了混淆咒才这么慢", "轻声说“速度加快”希望有奇效"] },
        { text: "陌生号码发短信“猜猜我是谁”，你会回什么？", opts: ["“你是不是复方汤剂喝多了”", "“我是傲罗办公室，请报身份”", "“你是从阿兹卡班越狱的吧”", "“别装了，我知道你是皮皮鬼”"] },
        { text: "朋友发了你的丑照，你会？", opts: ["回复“摄魂怪来了都比这好看”", "说“你中了夺魂咒才发这种图”", "回一张他像巨怪的旧照", "要求用“一忘皆空”消除记忆"] },
        { text: "面试官让你说缺点，你怎么答？", opts: ["“我总对麻瓜电器用恢复如初”", "“我分不清胡椒和飞路粉”", "“我老在电梯里练荧光闪烁”", "“我习惯对着镜子喊滑稽滑稽”"] },
        { text: "家里Wi-Fi断了，你先检查什么？", opts: ["路由器是不是被嗅嗅偷走了", "猫头鹰有没有踩到网线", "怀疑是皮皮鬼在捣乱", "对着光猫念“恢复如初”"] },
        { text: "梦见自己骑扫帚飞，但扫帚是拖把。醒来后你？", opts: ["下单买了把光轮2026", "查查是不是被下了恶咒", "觉得是魁地奇选拔的预兆", "认真考虑去趟对角巷"] },
        { text: "外卖送错了菜，你会？", opts: ["怀疑是迷情剂测试版", "觉得骑手中了混淆咒", "用“急急现形”看看是不是复方汤剂", "先让室友尝一口"] },
        { text: "下雨没带伞，路边有人卖伞。你会？", opts: ["问他有没有“防水防湿”款", "花十西可买一把会飞的", "自己用“幻身咒”隐身跑回家", "对天念“气象控制”然后被淋更惨"] },
        { text: "朋友说你瘦了，你会怎么回？", opts: ["“我偷偷喝了减龄剂”", "“是因为我练了阿尼玛格斯”", "“我把肥肉转移给皮皮鬼了”", "“只是袍子收腰而已”"] },
        { text: "二手平台买家问完“在吗”就消失了。你会？", opts: ["给他发“门牙赛大棒”表情包", "改价成“阿兹卡班特供价”", "留言“你是不是被摄魂怪抓走了”", "挂上新链接：“给已读不回者的诅咒版”"] },
        { text: "冰箱里的蛋糕少了一块，你怀疑室友。你会？", opts: ["对蛋糕盘念“闪回前咒”", "在冰箱上贴“防家养小精灵咒”", "用复方汤剂变成蛋糕守株待兔", "直接问“你是不是用了无痕伸展咒藏蛋糕”"] },
        { text: "聚会大冒险，对方让你学动物叫。你会？", opts: ["学凤凰的歌声", "学猫狸子的叫声", "学匈牙利树蜂的喷气声", "学嗅嗅偷金币时的哼唧"] },
        { text: "奶茶店有“魔法特调”，你会点吗？", opts: ["点“复方汤剂味”但要求不加人头发", "点“福灵剂特调”希望考试好运", "点“迷情剂奶茶”但只喝一口", "点“吐真剂柠檬茶”然后开始说实话"] },
        { text: "手机充电线被猫咬断了。你会？", opts: ["对猫说“你是克鲁克山转世吗”", "用“恢复如初”缠上胶带", "给猫戴上防恶咒项圈", "把猫变成充电宝"] },

        { text: "做饭盐放多了，你会？", opts: ["念“清水如泉”然后锅炸了", "用“分离咒”把盐析出来", "变成阿尼玛格斯逃走", "直接点外卖并用消失咒处理这锅菜"] },
        { text: "朋友失恋找你哭诉，你会？", opts: ["“别哭了，比桃金娘还吵”", "“给你熬一锅迷情剂反向版”", "“用一忘皆空吧，我帮你”", "“你是不是被他下了夺魂咒”"] },
        { text: "看到有人插队，你会？", opts: ["“你中了混淆咒才插队的吗”", "“我要叫费尔奇来抓你”", "“给你念个门牙赛大棒”", "“你是不是以为自己是马尔福”"] },
        { text: "口袋里多了一张纸条写着“小心”，你会？", opts: ["用“急急现形”看隐形墨水", "怀疑是活点地图掉下来的", "念“闪回前咒”查来源", "觉得是皮皮鬼的恶作剧"] },
        { text: "家里的植物快死了，你会？", opts: ["对它念“恢复如初”", "浇点曼德拉草复活剂", "把它换成假花然后用变形术", "怀疑是被下毒了，用“毒液探测”"] },
        { text: "坐飞机遇到颠簸，你会？", opts: ["小声念“平稳降落”", "对窗外念“气象控制”", "抓紧扶手说“这比魁地奇还刺激”", "问旁边的人“你会不会幻影移形”"] },
        { text: "朋友新纹身是闪电形状，你会？", opts: ["“你小心，有个人因为这个疤被追了七年”", "“这是黑魔标记的青春版吗”", "“你是不是想冒充救世主”", "“建议你纹个守护神更安全”"] },
        { text: "外卖少了餐具，你会？", opts: ["对空气说“家养小精灵借双筷子”", "用变形术把吸管变成叉子", "用飞来咒从邻居家借", "直接用手然后念“清洁一新”"] },
        { text: "小孩在地上打滚要买玩具，你会？", opts: ["“你再闹我叫皮皮鬼来收你”", "“你是不是中了夺魂咒”", "“给你念个全身束缚咒安静一下”", "“你比洛丽丝夫人还难缠”"] },
        { text: "钥匙找不到了，你会？", opts: ["对门念“阿拉霍洞开”", "用飞来咒试试", "怀疑被嗅嗅偷走了", "用“急急现形”看是不是隐形了"] },
        { text: "收到一封蜡封信，你会？", opts: ["怀疑是霍格沃茨录取通知书", "用“现形咒”看看是不是恶作剧", "先闻闻有没有迷情剂味道", "不敢拆，怕是吼叫信"] },
        { text: "你朋友说他会魔法，要给你表演。你会？", opts: ["“你先变个守护神我看看”", "“你是不是喝了复方汤剂的麻瓜”", "“你能不能用飞来咒把我钱包拿来”", "“你肯定是看了《魔法骗子》那本书”"] },
        { text: "你路过一家店叫“博金-博克”，你会？", opts: ["赶紧跑，怕被手拽住", "进去看看有没有打折货", "用隐形斗篷才敢靠近", "在门口大喊“我是傲罗”"] },
        { text: "你看到一只渡鸦站在窗台上盯着你。你会？", opts: ["“你是谁的猫头鹰送错地址了”", "“你是不是在帮我送信”", "“你会不会说话，说句梅林啊”", "“你比埃罗尔还胖”"] },
        { text: "你朋友喝醉了开始胡言乱语，你会？", opts: ["“你是不是喝了复方汤剂假酒”", "“给他灌点吐真剂醒醒”", "“用昏昏倒地让他安静”", "“你中了夺魂咒吧，我帮你解”"] },
        { text: "你发现钱包里多了一张陌生人的照片。你会？", opts: ["用“急急现形”看是不是动态的", "怀疑是预言家日报的赠品", "念“闪回前咒”查谁放的", "觉得是迷情剂的广告"] },
        { text: "你家的钟表突然倒着走。你会？", opts: ["“是不是被下了时间逆转咒”", "“我要联系魔法事故处理司”", "“可能附近有时光器”", "“皮皮鬼又调皮了”"] },
        { text: "你朋友说他能和蛇说话。你会？", opts: ["“你是爬说语还是喝了蛇佬腔药水”", "“你该不会姓冈特吧”", "“你小心被关进阿兹卡班”", "“你能帮我问问蛇我的钥匙在哪吗”"] },
        { text: "你看到一个人对着杯子念“清水如泉”。你会？", opts: ["“你魔杖是筷子吧”", "“你是霍格沃茨新生吗”", "“你这咒语念反了会爆炸”", "“别费劲了，这是麻瓜杯子”"] },
        { text: "你发现自己突然能看穿别人的想法。你会？", opts: ["“我是不是成了摄神取念大师”", "“这一定是大脑封闭术没练好”", "“快去霍格沃茨找斯内普”", "“先看看朋友有没有骂我”"] },
        { text: "你煮的汤自己冒泡跳出了锅。你会？", opts: ["“你是不是活过来了”", "用‘速速禁锢’抓住它", "“这是熬出了生命药水吗”", "“叫家养小精灵来收拾”"] },
        { text: "你看到邻居家的烟囱冒绿烟。你会？", opts: ["“是不是飞路粉用多了”", "“他家壁炉连上了魔法部”", "“可能是个食死徒在练习”", "“快打给魔法火灾司”"] },
        { text: "你朋友说昨晚梦到你在骑扫帚比赛。你会？", opts: ["“我肯定是找球手”", "“你梦到的是魁地奇世界杯吧”", "“我其实骑的是拖把”", "“你是不是看了我的冥想盆”"] },
        { text: "你收到一条语音，内容是“我就是你”。你会？", opts: ["“你喝了复方汤剂变成我”", "“你是从未来回来的吗”", "“这是柏格特在搞鬼”", "“你是厄里斯魔镜里的我”"] },
        { text: "你发现自己走路时脚不沾地。你会？", opts: ["“我是不是变成幽灵了”", "“中了漂浮咒还没解”", "“我可能成了无头骑士”", "“快找魔杖念‘落地生根’”"] },
        { text: "你朋友送了你一盒比比多味豆。你会？", opts: ["先闻闻有没有耳屎味", "让室友先吃一颗", "用“探测咒”查口味", "直接扔进垃圾桶"] },
        { text: "你看到一只蟾蜍在路边哭。你会？", opts: ["“你是不是纳威丢的那只”", "用‘恢复如初’看看能不能变王子", "“别哭了，比桃金娘还吵”", "“你是谁的魔药实验品”"] },
        { text: "你家的门会自动开关。你会？", opts: ["“是不是有幽灵路过”", "“皮皮鬼你出来”", "‘开门咒’忘关了", "快念‘永久粘贴’锁住"] },
        { text: "你发现自己的影子在做不同的事。你会？", opts: ["“你中了分离咒”", "“你是我的阿尼玛格斯吗”", "“你是不是从活点地图里跑出来的”", "用‘统统石化’定住你"] },
        { text: "你朋友说他能召唤守护神。你会？", opts: ["“你快乐的记忆是什么？食堂烤土豆吗”", "“你变个银色的给我看看”", "“你魔杖借我试试”", "“你是不是看了太多同人文”"] },
        { text: "你走进一家酒吧叫“猪头”。你会？", opts: ["小声问“有没有卖复方汤剂”", "找老阿不福思擦杯子", "点一杯“忘忧啤酒”", "怕被下迷情剂赶紧出来"] },
        { text: "你发现自己会不知不觉变成猫。你会？", opts: ["“我是麦格教授的亲戚吗”", "“这一定是阿尼玛格斯失控”", "快去霍格沃茨求助", "先玩玩毛线球"] },
        { text: "你听到壁炉里有声音说“出来”。你会？", opts: ["“你是飞路网客服吗”", "“是不是有人用飞路粉迷路了”", "“我是傲罗，请报身份”", "扔个粪蛋进去试试"] },
        { text: "你收到一封吼叫信，但寄件人是自己。你会？", opts: ["未来的我寄来骂现在的我", "这是时间转换器搞的鬼", "快拆开听听说了什么", "用‘无声无息’憋住它"] },
        { text: "你发现自己能听懂画中人的话。你会？", opts: ["问历任校长的画片借笔记", "让胖夫人帮你开宿舍门", "和走廊盔甲聊天", "找一幅空白画框给自己画像"] },
        { text: "你朋友说他中了夺魂咒。你会？", opts: ["给他念“咒立停”", "问他“你现在想做什么”", "把他关进柜子里", "带他去圣芒戈"] },
        { text: "你看到一只猫头鹰叼着信在你窗外。你会？", opts: ["开窗拿信", "怀疑是录取通知书", "先看看是不是麻瓜的鸽子", "给猫头鹰一枚西可小费"] },
        { text: "你发现自己的魔杖（或者筷子）会自己动。你会？", opts: ["“你是不是被施了咒”", "快念‘除你武器’抓住它", "你是从奥利凡德偷跑出来的", "用‘统统石化’按住"] },
        { text: "如果能选一门霍格沃茨课程免费上，你会选？", opts: ["魔药课（为了偷福灵剂配方）", "变形课（为了变成猫）", "黑魔法防御术（为了对付皮皮鬼）", "飞行课（为了迟到不迟到）"] }
    ];

    // 70个分院结果 (0~69) 已修正双胞胎bug
    const RESULTS = [
        { title: "格兰芬多", desc: "你冲动了。但至少冲在前面。别人用脑子的时候你用了扫帚，不过没关系，桃金娘的哭声都比你的后悔声大。" },
        { title: "赫奇帕奇", desc: "你擅长吃和忠诚。夜宵记得叫你。你人缘好到连斯内普扣分都犹豫了三秒——虽然最后还是扣了。" },
        { title: "拉文克劳", desc: "你熬夜看书，结果考试范围是另外三章。你气得把《霍格沃茨：一段校史》垫了泡面，真香。" },
        { title: "斯莱特林", desc: "你很有野心，野心是周末睡到中午。你试图用“尽耍手段”让室友安静，结果被对方用“统统石化”反杀了。" },
        { title: "家养小精灵", desc: "你主动帮室友洗袜子。他们管你叫多比2.0。你一边洗一边骂“主人真懒”，但袜子扔过来时你还是会接住。" },
        { title: "半人马", desc: "你拒绝交占卜课作业，说“星星不想写论文”。特里劳妮教授哭了一节课，你站在教室门口看云，觉得很自由。" },
        { title: "神奇动物", desc: "一个提着箱子的怪人正朝你跑来。快跑。你也不知道自己算哪种神奇动物，但箱子里那只好客的嗅嗅已经在掏你的口袋了。" },
        { title: "阿兹卡班", desc: "你获得摄魂怪之吻体验券一张，有效期余生。你试图用“呼神护卫”挡一下，结果脑海里最快乐的记忆是去年食堂的烤土豆。" },
        { title: "食死徒", desc: "黑魔王HR发来入职通知，试用期不带薪。你问了句“有五险一金吗”，对面直接把钻心咒的培训视频发了过来。" },
        { title: "超级麻瓜", desc: "你魔法为零但会修路由器，全霍格沃茨抢着要你。韦斯莱家的Wi-Fi密码就是你猜出来的，虽然他们压根没有宽带。" },
        { title: "霍格沃茨厨房", desc: "你半夜给熬夜学生做炸鱼薯条，没有加班费。但你可以偷吃，而且皮皮鬼每次抢你薯条都会被热油烫到手指。" },
        { title: "皮皮鬼跟班", desc: "你负责在校长讲话时吹口哨，上周被费尔奇追了八层楼。皮皮鬼说这是光荣传统，你觉得这是工伤。" },
        { title: "哭泣的桃金娘", desc: "你获得女生盥洗室永久VIP，附赠终身回音。你现在能跟桃金娘聊到凌晨三点，聊的话题主要是“为什么男生总是那么烦”。" },
        { title: "八楼挂毯", desc: "你每次想进有求必应屋，都会变成墙上那只傻巴拿巴。你现在最熟练的技能是用挂毯的线头织毛衣，路过的级长都给你竖大拇指。" },
        { title: "魔法交通司", desc: "你疏通全校壁炉烟道，发现飞路粉不是胡椒粉。你问为什么总有人把飞路粉撒在早餐蛋上，那人说“我想省时间通勤”。" },
        { title: "失物招领处", desc: "你给上千只失踪袜子配对，昨天一只袜子说它不想被穿左脚。你跟它聊了二十分钟人生，最后决定把它捐给家养小精灵。" },
        { title: "费尔奇的眼线", desc: "你脖子上挂“走廊监视器”工牌，皮皮鬼往你袍子里塞了粪蛋。你追了它三圈，最后发现粪蛋是你自己鞋底踩到的。" },
        { title: "黑湖巨乌贼的心理咨询师", desc: "你潜下水听它抱怨，它说学生掉下来的屁股太重了。你建议它用触手接人，它说“我是章鱼不是蹦床”。" },
        { title: "尖叫棚屋ASMR主播", desc: "你录狼人咀嚼骨头的声音，邻居投诉太下饭。你现在月收入能买三根魔杖，但每次录音都会被某个狼人教授的鬼魂问“这是不是我当年的口癖”。" },
        { title: "禁止滥用麻瓜物品卧底", desc: "你假装卖魔法电饭煲，自己偷偷用电动牙刷。你的上司有一天发消息说“那个牙刷我也买了，别装了”。" },
        { title: "猪头酒吧还贷员工", desc: "你给老阿不福思擦酒杯，他每次付三西可加一句“你比你哥差远了”。你根本没有哥，他就是嘴硬。" },
        { title: "桃金娘表哥（活人版）", desc: "所有人穿墙而过无视你，你开始在盥洗室哭，成功转正。现在你每天和桃金娘抢马桶，她哭你也哭，吵得楼上不准上课。" },
        { title: "有求必应屋被困者", desc: "你出不来了但Wi-Fi满格，你学会了用消失柜点外卖。外卖小哥是费尔奇，他骂你地址写“在挂毯和盔甲之间”。" },
        { title: "特快零食车助理", desc: "你每次经过某个黑发学生都被问“有比比多味豆吗”，你说被纳威买走了最后一包辣的。对方翻了个白眼，你顺手塞给他一只巧克力蛙。" },
        { title: "打人柳修剪工", desc: "你负责给打人柳剪枝，它上周把你弹进了黑湖。你在湖底跟巨乌贼聊了十分钟，它说打人柳青春期叛逆很正常。" },
        { title: "蜂蜜公爵试吃员", desc: "你吃遍所有巧克力蛙，发现某位老校长的画片最多。你还发现酸味爆爆糖能治牙疼——假的，你的牙掉了一颗。" },
        { title: "佐科笑话店测试员", desc: "你试吃了速效逃课糖，拉肚子拉了三天。某位少了一只耳朵的巫师笑着摇头说：“兄弟，那是二代产品，我们还没上市呢。”" },
        { title: "翻倒巷迷路游客", desc: "你只是想抄近道去古灵阁，博金-博克店里的手拽住了你。你尖叫着甩开，那手说“别怕，我就是想借个打火机”。" },
        { title: "护树罗锅饲养员", desc: "你负责哄护树罗锅开门，它们只吃你给的嘎嘣脆虫子。你问它们能不能换个口味，它们集体冲你比了根小树枝中指。" },
        { title: "嗅嗅的临时家长", desc: "你帮它藏亮闪闪的东西，昨天它偷走了你的门钥匙。你现在被困在对角巷，用借来的魔杖发了一张猫头鹰传书：“救命，我没带钱”。" },
        { title: "冥想盆清洁工", desc: "你负责倒掉多余的记忆，不小心看到某位油腻黑发教授的洗发水广告。广告词是“油头救星”，你吓得把冥想盆打翻了。" },
        { title: "柏格特管理专员", desc: "你把柏格特关在衣柜里，它学会了模仿你老板发微信语音。你打开衣柜大喊“滑稽滑稽”，结果它变成了你妈。" },
        { title: "金色飞贼修复师", desc: "你给金色飞贼装新翅膀，它现在飞得比光轮2000还快。你试着抓了它一次，摔断了尾椎骨，躺在医疗翼写了五千字检讨。" },
        { title: "游走球质检员", desc: "你负责测试游走球够不够暴力，上个月被撞断了三根肋骨。你的工牌写着“自愿参与”，你怀疑这是你签过最坑的合同。" },
        { title: "火焰杯保安", desc: "你负责不让低年级乱投名字，结果你自己被烧了胡子。麦格教授路过说“冷静”，然后火焰杯朝你吐了个火球。" },
        { title: "三强争霸赛龙饲料员", desc: "你给匈牙利树蜂喂死鸡，它朝你吐了口火，眉毛没了。你后来发现那鸡是它前男友变的，你也不知道自己怎么知道的。" },
        { title: "对角巷门钥匙管理员", desc: "你把门钥匙藏在破釜酒吧的垃圾桶里，有人把它当垃圾扔了。现在三十个巫师困在陋居门口，你被魔法部罚扫了一个月烟囱。" },
        { title: "预言家日报送报员", desc: "你每天骑着扫帚扔报纸，某位甲虫阿尼玛格斯记者骂你扔得太准。你把下一期报纸塞进了她家的甲虫窝，第二天她写了一整版骂你。" },
        { title: "霍格沃茨校报实习生", desc: "你负责采访皮皮鬼，他把你写的稿子变成了唱歌的蟾蜍。主编说“有话题度”，你只好把那蟾蜍养在了办公桌抽屉里。" },

        { title: "魔法帐篷质检员", desc: "你负责测试帐篷是不是漏水，结果你打开的那顶里面已经住了一窝护树罗锅。它们把你赶出来，还顺走了你的鞋带。" },
        { title: "骑士公共汽车售票员", desc: "你给乘客发巧克力蛙，但他们都在吐。售票员说“因为你发的都是耳屎味的”，你这才发现拿错了盒子。" },
        { title: "破釜酒吧临时工", desc: "你帮老汤姆擦吧台，他让你去地窖搬酒桶。你发现地窖里藏了一面厄里斯魔镜，镜子里写着“你不属于这里”。" },
        { title: "麻瓜研究课助教", desc: "你被迫给纯血统学生解释什么是“冰箱”。你说“就是一个不会魔法也能让食物变冷的柜子”，他们集体沉默了，然后问“那它用什么咒语”。" },
        { title: "魔法史考试出题人", desc: "你出的题是“公元1296年某巫师早餐吃了什么”。没有人及格，宾斯教授飘过来说“我也不知道，但那顿早餐很重要”。" },
        { title: "分院帽的干洗工", desc: "你负责给分院帽除灰，它每次都说“你适合赫奇帕奇”。你说“我已经分过了”，它说“那我再分一次——阿兹卡班”。" },
        { title: "霍格沃茨校歌领唱", desc: "你选什么调他们就唱什么调。上周你选了《错位时空》，麦格教授说“这是哪门子校歌”，但你还是带着全校唱完了。" },
        { title: "餐桌布草管理员", desc: "你负责换礼堂长桌桌布，皮皮鬼总在你换到一半时把桌布拉走。你现在学会了一次性铺四张，但被家养小精灵投诉浪费。" },
        { title: "魁地奇更衣室管理员", desc: "你负责给球员发护膝，发现某个队长每次赛前都要抱着扫帚哭十分钟。你觉得那不是战术，是心理问题。" },
        { title: "鬼魂联谊会会长", desc: "你组织差点没头的尼克和血人巴罗一起喝茶。尼克抱怨脖子疼，巴罗说他羡慕有脖子的，你夹在中间觉得自己更像个鬼。" },
        { title: "血人巴罗的倾诉对象", desc: "巴罗每周找你聊一次，内容全是“她到底有没有原谅我”。你不敢说“没有”，你就说“也许吧”，然后他沉默，然后你后悔。" },
        { title: "格雷女士的心理辅导师", desc: "她每次来都哭，说“他为什么不看我”。你问“谁”，她说“血人巴罗”。你说“那你去跟他说啊”，她说“不，太尴尬了”。你疯了。" }
    ];

    const SCORE_MAP = [0, 1, 3, 5];
    let currentQuestions = [];
    let currentIndex = 0;
    let quizActive = false;
    let autoTimer = null;
    let currentResultTitle = "";

    const startScreen = document.getElementById('startScreen');
    const questionArea = document.getElementById('questionArea');
    const resultScreen = document.getElementById('resultScreen');
    const startBtn = document.getElementById('startBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const restartBtn = document.getElementById('restartBtn');
    const shareBtn = document.getElementById('shareBtn');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const qCounterSpan = document.getElementById('qCounter');
    const progressFill = document.getElementById('progressFill');
    const resultTitleSpan = document.getElementById('resultTitle');
    const resultDescSpan = document.getElementById('resultDesc');

    function selectRandomQuestions() {
        const shuffled = [...MASTER_QUESTIONS];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled.slice(0, 20).map(q => ({
            text: q.text,
            opts: [...q.opts],
            selectedIndex: null
        }));
    }

    function clearAutoTimer() {
        if (autoTimer) {
            clearTimeout(autoTimer);
            autoTimer = null;
        }
    }

    function renderCurrentQuestion() {
        if (!quizActive) return;
        const q = currentQuestions[currentIndex];
        if (!q) return;
        questionText.innerText = q.text;
        let optsHtml = '';
        q.opts.forEach((opt, idx) => {
            const isChecked = (q.selectedIndex === idx);
            const letter = String.fromCharCode(65+idx);
            optsHtml += `
                <div class="option" data-opt-index="${idx}">
                    <input type="radio" name="questionOption" id="opt_${idx}" value="${idx}" ${isChecked ? 'checked' : ''}>
                    <label for="opt_${idx}"><strong>${letter}.</strong> ${opt}</label>
                </div>
            `;
        });
        optionsContainer.innerHTML = optsHtml;

        const optionDivs = document.querySelectorAll('.option');
        optionDivs.forEach(div => {
            const radio = div.querySelector('input[type="radio"]');
            const handleSelect = () => {
                if (!radio.checked) {
                    radio.checked = true;
                    currentQuestions[currentIndex].selectedIndex = parseInt(div.dataset.optIndex);
                    clearAutoTimer();
                    autoTimer = setTimeout(() => {
                        if (quizActive && currentIndex < 19 && currentQuestions[currentIndex].selectedIndex !== null) {
                            goNextAuto();
                        } else if (quizActive && currentIndex === 19 && currentQuestions[currentIndex].selectedIndex !== null) {
                            computeAndShowResult();
                        }
                    }, 200);
                }
            };
            div.addEventListener('click', handleSelect);
            const radioElem = div.querySelector('input');
            if (radioElem) {
                radioElem.addEventListener('change', function(e) {
                    if (this.checked) {
                        currentQuestions[currentIndex].selectedIndex = parseInt(this.value);
                        clearAutoTimer();
                        autoTimer = setTimeout(() => {
                            if (quizActive && currentIndex < 19 && currentQuestions[currentIndex].selectedIndex !== null) {
                                goNextAuto();
                            } else if (quizActive && currentIndex === 19 && currentQuestions[currentIndex].selectedIndex !== null) {
                                computeAndShowResult();
                            }
                        }, 200);
                    }
                });
            }
        });

        qCounterSpan.innerText = `第${currentIndex+1} / 20题`;
        const percent = ((currentIndex+1)/20)*100;
        progressFill.style.width = `${percent}%`;
        prevBtn.disabled = (currentIndex === 0);
        nextBtn.disabled = false;
    }

    function goPrev() {
        if (!quizActive) return;
        clearAutoTimer();
        if (currentIndex > 0) {
            currentIndex--;
            renderCurrentQuestion();
        }
    }

    function goNext() {
        if (!quizActive) return;
        const currentQ = currentQuestions[currentIndex];
        if (currentQ.selectedIndex === null) {
            alert("请先选择一个答案，分院帽正在等待你的选择。");
            return;
        }
        clearAutoTimer();
        if (currentIndex < 19) {
            currentIndex++;
            renderCurrentQuestion();
        } else {
            computeAndShowResult();
        }
    }

    function goNextAuto() {
        if (!quizActive) return;
        if (currentIndex < 19) {
            currentIndex++;
            renderCurrentQuestion();
        } else {
            computeAndShowResult();
        }
    }

    function computeAndShowResult() {
        clearAutoTimer();
        let totalScore = 0;
        for (let i=0; i<currentQuestions.length; i++) {
            const sel = currentQuestions[i].selectedIndex;
            if (sel !== null) totalScore += SCORE_MAP[sel];
        }
        let idx = Math.round((totalScore / 100) * 69);
        idx = Math.min(69, Math.max(0, idx));
        const result = RESULTS[idx];
        currentResultTitle = result.title;
        resultTitleSpan.innerText = currentResultTitle;
        resultDescSpan.innerText = result.desc;
        startScreen.style.display = 'none';
        questionArea.style.display = 'none';
        resultScreen.style.display = 'block';
        quizActive = false;
    }

    function startTest() {
        clearAutoTimer();
        currentQuestions = selectRandomQuestions();
        currentIndex = 0;
        quizActive = true;
        startScreen.style.display = 'none';
        questionArea.style.display = 'block';
        resultScreen.style.display = 'none';
        renderCurrentQuestion();
    }

    function restartTest() {
        startTest();
    }

    // 分享功能：截图 + 复制文本
    async function shareResult() {
        const element = document.getElementById('shareScreenshotArea');
        if (!element) return;
        try {
            // 显示加载提示（可选）
            const originalText = shareBtn.innerText;
            shareBtn.innerText = "生成中...";
            shareBtn.disabled = true;
            const canvas = await html2canvas(element, {
                scale: 2,
                backgroundColor: '#fdf8ed',
                logging: false,
                useCORS: false
            });
            // 下载图片
            const link = document.createElement('a');
            const imageData = canvas.toDataURL('image/png');
            link.download = `Hogwarts_Result_${currentResultTitle}.png`;
            link.href = imageData;
            link.click();
            // 复制文本
            const shareText = `我的测试结果是【${currentResultTitle}】，你也来试试吧！链接：https://cosmosoul.github.io/Hogwarts-Sorting/`;
            await navigator.clipboard.writeText(shareText);
            alert("结果图片已保存，分享文案已复制到剪贴板！");
            shareBtn.innerText = originalText;
            shareBtn.disabled = false;
        } catch (err) {
            console.error("截图失败:", err);
            alert("生成图片失败，可尝试手动截图。文案已复制到剪贴板。");
            const shareText = `我的测试结果是【${currentResultTitle}】，你也来试试吧！链接：https://cosmosoul.github.io/Hogwarts-Sorting/`;
            await navigator.clipboard.writeText(shareText);
            shareBtn.disabled = false;
            shareBtn.innerText = "分享结果";
        }
    }

    startBtn.addEventListener('click', startTest);
    prevBtn.addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNext);
    restartBtn.addEventListener('click', restartTest);
    if (shareBtn) shareBtn.addEventListener('click', shareResult);
</script>
